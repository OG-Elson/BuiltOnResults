<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start a Project — BuiltOnResults</title>
<meta name="description" content="Share your project brief and I'll get back to you within 48 hours with the best next step.">
<link rel="canonical" href="https://builtonresults.co.ke/consultation">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--coral:#E8A87C;--coral-d:#DE9463;--ink:#141210;--cream:#F5F0E7;--paper:#FBF8F2;--muted:#6f6a63;--line:rgba(20,18,16,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;padding:1.5rem}
.wrap{max-width:640px;margin:2.5rem auto}
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:2rem;text-decoration:none;color:var(--ink)}
.top img{height:36px;width:auto}
.top b{font-family:'Archivo';font-weight:900;font-size:1.05rem;letter-spacing:-.02em}
.tag{font-family:'Archivo';font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--coral-d)}
h1{font-family:'Archivo';font-weight:800;text-transform:uppercase;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.02;margin:.5rem 0 .8rem}
.intro{color:var(--muted);font-size:1.02rem;margin-bottom:2rem;max-width:560px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.8rem 1.5rem;box-shadow:0 10px 40px rgba(20,18,16,.05)}
label{display:block;font-family:'Archivo';font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:1.1rem 0 .4rem}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;font-family:'Inter',sans-serif;font-size:16px;padding:.7rem .85rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn{width:100%;margin-top:1.6rem;background:var(--ink);color:#fff;border:none;border-radius:100px;padding:.9rem;font-family:'Archivo';font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{background:#000;transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{font-size:.85rem;margin-top:.8rem;min-height:1em}
.done{text-align:center;font-size:1.1rem;font-weight:600;color:#15803d;padding:1.5rem 0}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:1.5rem}
.foot a{color:var(--ink)}
</style>
<script defer src="https://analytics.builtonresults.co.ke/script.js" data-website-id="bf937960-b95a-4c84-b467-62f76cb830c4"></script>
</head>
<body>
<div class="wrap">
<a href="/" class="top"><img src="logo-br.png" alt="BuiltOnResults"><b>BUILTONRESULTS</b></a>
<span class="tag">Start a Project</span>
<h1>Tell me about your project.</h1>
<p class="intro">Share your project — I'll review and get back to you within 48h with the best next step (a call, a quote, or a personalized proposal).</p>
<div class="card" id="formwrap">
<label for="name">Your name</label>
<input type="text" id="name" autocomplete="name" placeholder="Jane Doe">
<label for="email">Email</label>
<input type="email" id="email" autocomplete="email" placeholder="jane@example.com">
<label for="project_type">Project type</label>
<select id="project_type">
<option value="Website">Website</option>
<option value="E-commerce">E-commerce</option>
<option value="SaaS">SaaS / Web app</option>
<option value="Digital strategy">Digital strategy</option>
<option value="Other">Other</option>
</select>
<label for="budget">Budget</label>
<select id="budget">
<option value="Not sure yet">Not sure yet</option>
<option value="< $500">Less than $500</option>
<option value="$500-2000">$500 – $2,000</option>
<option value="$2000-5000">$2,000 – $5,000</option>
<option value="> $5000">More than $5,000</option>
</select>
<label for="timeline">Timeline</label>
<select id="timeline">
<option value="Just exploring">Just exploring</option>
<option value="> 3 months">More than 3 months</option>
<option value="< 3 months">Less than 3 months</option>
<option value="Urgent">Urgent</option>
</select>
<label for="description">Tell me about it</label>
<textarea id="description" placeholder="What do you want to build or achieve? Who is it for? (min 20 characters)"></textarea>
<input type="text" id="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" id="submit" onclick="submitBrief()">Send my brief</button>
<div class="msg" id="msg"></div>
</div>
<div class="foot">Prefer to just check your site's SEO first? <a href="/audit">Run a free audit →</a></div>
</div>
<script>
async function submitBrief(){
const g=id=>document.getElementById(id);
const name=g('name').value.trim(),email=g('email').value.trim(),desc=g('description').value.trim();
const msg=g('msg');
if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||desc.length<20){msg.style.color='#c0392b';msg.textContent='Please add your name, a valid email, and a description (min 20 characters).';return;}
if(window.__sent)return;
const btn=g('submit');btn.disabled=true;msg.style.color='';msg.textContent='Sending…';
try{
const q=new URLSearchParams({fn:'brief',name:name,email:email,description:desc,project_type:g('project_type').value,budget:g('budget').value,timeline:g('timeline').value,company:g('company').value});
const r=await fetch('/flyer/api/search?'+q.toString());const d=await r.json();
if(!d.ok){msg.style.color='#c0392b';msg.textContent='Please check your inputs and try again.';btn.disabled=false;return;}
window.__sent=true;try{window.umami&&umami.track('consultation_submit')}catch(e){}
g('formwrap').innerHTML='<div class="done">✅ Thanks! I\'ll review your brief and get back to you within 48 hours.</div>';
}catch(e){msg.style.color='#c0392b';msg.textContent='Network error. Please try again.';btn.disabled=false;}
}
</script>
</body>
</html>
