<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BuiltOnResults — Logo</title>
<style>
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:sans-serif;padding:2rem}
h2{color:#a78bfa;margin-bottom:1rem}
.logos{display:flex;gap:3rem;flex-wrap:wrap;justify-content:center;align-items:center}
.logo-box{text-align:center}
.logo-box img{width:200px;height:200px;border-radius:20px;display:block;margin-bottom:.5rem}
p{color:#6b7280;font-size:.8rem;margin:.3rem 0}
a{color:#6366f1}
.btn{display:inline-block;background:#6366f1;color:#fff;padding:.5rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.8rem;margin-top:.5rem}
</style>
</head><body>
<h2>BuiltOnResults — Logo</h2>
<div class="logos">
<div class="logo-box">
<img src="/flyer/logo.svg" alt="Logo principal">
<p>Logo principal</p>
<a href="/flyer/logo.svg" class="btn" download>Télécharger SVG</a>
</div>
<div class="logo-box">
<img src="/flyer/logo_avatar.svg" alt="Logo avatar">
<p>Logo avatar (profil)</p>
<a href="/flyer/logo_avatar.svg" class="btn" download>Télécharger SVG</a>
</div>
</div>
</body></html>
